[package]
name = "smallvec"
version = "2.0.0-alpha.12"
edition = "2021"
rust-version = "1.83"
authors = ["The Servo Project Developers"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/servo/rust-smallvec"
description = "'Small vector' optimization: store up to a small number of items on the stack"
keywords = ["small", "vec", "vector", "stack", "no_std"]
categories = ["data-structures"]
readme = "README.md"
documentation = "https://docs.rs/smallvec/"
include = ["Cargo.toml", "LICENSE-MIT", "LICENSE-APACHE", "README.md", "src/**/*.rs"]

[features]
std = []
specialization = []
may_dangle = []
extract_if = []
serde = ["dep:serde_core"]
etna = [
    "std",
    "dep:proptest",
    "dep:quickcheck_etna",
    "dep:crabcheck",
    "dep:hegeltest",
    "dep:rand_etna",
]

[dependencies]
bytes = { version = "1", optional = true, default-features = false }
serde_core = { version = "1.0.221", optional = true, default-features = false }
malloc_size_of = { version = "0.1.1", optional = true, default-features = false }

# ETNA framework deps — only needed by the `etna` bin target. Kept as regular
# (non-optional) deps so that `cargo build --bin etna` works without enabling
# the "etna" feature, but the bin itself is gated with `required-features`.
proptest = { version = "1.11.0", optional = true }
quickcheck_etna = { git = "https://github.com/alpaylan/quickcheck.git", branch = "master", package = "quickcheck", features = ["etna"], optional = true }
crabcheck = { git = "https://github.com/alpaylan/crabcheck.git", branch = "main", optional = true }
hegeltest = { version = "0.3.7", optional = true }
rand_etna = { package = "rand", version = "0.9", optional = true }

[dev-dependencies]
serde_json = "1"
bincode = "1.0.1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "etna"
path = "src/bin/etna.rs"
required-features = ["etna"]

[[bin]]
name = "etna-faultloc"
path = "src/bin/etna-faultloc.rs"
required-features = ["etna"]
